server.port=${PORT:8082}
server.servlet.context-path=/
spring.application.name=vistraa-backend

# Dynamic Database Configuration (Render Environment Variables with Local Fallbacks)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:vistraadb}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}

# H2 Console (Local Debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# FastAPI AI Microservice Endpoint
ai.service.url=${AI_SERVICE_URL:http://localhost:8000}
